name: Build and Release OdinUP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux Runners ---
          - os: ubuntu-latest
            target: linux_amd64
            name: odinup-linux-amd64
            exe: odinup
            ext: tar.gz

          - os: ubuntu-24.04-arm
            target: linux_arm64
            name: odinup-linux-arm64
            exe: odinup
            ext: tar.gz

          # --- macOS Runners ---
          - os: macos-latest
            target: darwin_amd64
            name: odinup-darwin-amd64
            exe: odinup
            ext: tar.gz

          - os: macos-latest
            target: darwin_arm64
            name: odinup-darwin-arm64
            exe: odinup
            ext: tar.gz

          # --- Windows Runner ---
          - os: windows-latest
            target: windows_amd64
            name: odinup-windows-amd64
            exe: odinup.exe
            ext: zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Odin Compiler
        uses: laytan/setup-odin@v2
        with:
          release: "latest"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile OdinUP
        run: odin build . -target:${{ matrix.target }} -out:${{ matrix.exe }} -o:speed

      - name: Package Archive (Tar.gz)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          chmod +x ${{ matrix.exe }}
          tar -czf ${{ matrix.name }}.tar.gz ${{ matrix.exe }}

      - name: Package Archive (Zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: Compress-Archive -Path ${{ matrix.exe }} -DestinationPath ${{ matrix.name }}.zip

      - name: Upload Artifact to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.${{ matrix.ext }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all Compiled Archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          generate_release_notes: true
